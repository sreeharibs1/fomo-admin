<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOMO Reading Room Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { max-width: 400px; width: 100%; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; padding: 30px 20px; }
    .btn-launch { background-color: #0d6efd; color: white; font-weight: 700; padding: 14px 20px; border-radius: 12px; text-decoration: none; display: block; width: 100%; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(13,110,253,0.3); }
    .btn-launch:hover { background-color: #0b5ed7; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h3 class="mb-2 fw-bold text-dark">📚 FOMO Admin Portal</h3>
    <p class="text-muted mb-4 small">Tap the button below to open your management dashboard smoothly in Chrome or Safari.</p>
    
    <!-- Direct native browser intent launch link -->
    <a id="launchBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-launch mb-3">
      🚀 Open Dashboard in Chrome
    </a>
    
    <div class="text-secondary" style="font-size: 0.75rem;">
      Compatible with Android, iPhone, WhatsApp & Webviews
    </div>
  </div>

  <script>
    var scriptUrl = "https://script.google.com/macros/s/AKfycbziOKcsCArNgE7_xrdLRRJ1SrFgIWLixAXJLWgzOlvvJv_EglJc4gwSl9UfgfI7NUKO/exec";
    var cleanUrl = scriptUrl.replace("https://", "");

    // Android Intent URI to force opening in external Chrome browser app
    var androidIntent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";

    // Detect device type
    var isAndroid = /Android/i.test(navigator.userAgent);
    
    var launchBtn = document.getElementById('launchBtn');

    if (isAndroid) {
      // Force Android Chrome launch
      launchBtn.href = androidIntent;
      // Auto-trigger intent
      window.location.href = androidIntent;
    } else {
      // Standard iOS/Desktop fallback link
      launchBtn.href = scriptUrl;
      window.location.href = scriptUrl;
    }
  </script>
</body>
</html>
